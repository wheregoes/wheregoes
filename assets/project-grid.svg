<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" role="img" aria-label="projects: byd-dolphin-hacking and byd-apps">
  <title>byd-dolphin-hacking · byd-apps</title>

  <defs>
    <!-- shared glass fill / rim -->
    <linearGradient id="pgFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.07)"/>
      <stop offset="35%"  stop-color="rgba(255,255,255,0.01)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.04)"/>
    </linearGradient>
    <linearGradient id="pgRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.20)"/>
      <stop offset="50%"  stop-color="rgba(255,255,255,0.04)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.10)"/>
    </linearGradient>

    <!-- accent blooms per tile -->
    <radialGradient id="pgBloomM" cx="15%" cy="0%" r="80%">
      <stop offset="0%"  stop-color="#00ff88" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pgBloomC" cx="15%" cy="0%" r="80%">
      <stop offset="0%"  stop-color="#00f0ff" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>

    <pattern id="pgScanM" patternUnits="userSpaceOnUse" width="440" height="3">
      <rect width="440" height="1" fill="#00ff88" fill-opacity="0.04"/>
    </pattern>
    <pattern id="pgScanC" patternUnits="userSpaceOnUse" width="440" height="3">
      <rect width="440" height="1" fill="#00f0ff" fill-opacity="0.04"/>
    </pattern>

    <filter id="pgGlowM" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pgGlowC" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="pgClipL"><rect x="1" y="6" width="438" height="158" rx="18"/></clipPath>
    <clipPath id="pgClipR"><rect x="461" y="6" width="438" height="158" rx="18"/></clipPath>
  </defs>

  <!-- ─── left tile: byd-dolphin-hacking (matrix accent) ────── -->
  <g clip-path="url(#pgClipL)">
    <rect x="1" y="6" width="438" height="158" rx="18" fill="#070912"/>
    <rect x="1" y="6" width="438" height="158" fill="url(#pgBloomM)"/>
    <rect x="1" y="6" width="438" height="158" fill="url(#pgFill)"/>
    <rect x="1" y="6" width="438" height="158" fill="url(#pgScanM)"/>
  </g>
  <rect x="1.5" y="6.5" width="437" height="157" rx="18" fill="none" stroke="url(#pgRim)" stroke-width="1"/>

  <text x="22" y="29" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace"
        font-size="9" fill="#00ff88" fill-opacity="0.55" letter-spacing="1.6">[REPO.0x01]</text>

  <text x="22" y="63" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace"
        font-size="19" font-weight="700" fill="#00ff88" filter="url(#pgGlowM)" letter-spacing="-0.4">
    <tspan fill-opacity="0.5">$ </tspan>byd-dolphin-hacking
  </text>

  <text x="22" y="91" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace"
        font-size="11.5" fill="#8fb8a0" letter-spacing="0">
    <tspan x="22" dy="0">reverse engineering byd dolphin head unit —</tspan>
    <tspan x="22" dy="16">can bus, avas, nfc, ota. dilink 3 / android 10.</tspan>
  </text>

  <g transform="translate(22 139)">
    <circle cx="4" cy="-3" r="4" fill="#00ff88">
      <animate attributeName="fill-opacity" values="0.7;1;0.7" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="14" y="0" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace"
          font-size="10" fill="#00ff88" letter-spacing="0.4">Kotlin · CAN</text>
  </g>
  <text x="418" y="139" text-anchor="end"
        font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace"
        font-size="10" fill="#4a6b58" letter-spacing="0.6">→ open repo</text>

  <!-- ─── right tile: byd-apps (cyan accent) ────────────────── -->
  <g clip-path="url(#pgClipR)">
    <rect x="461" y="6" width="438" height="158" rx="18" fill="#070912"/>
    <rect x="461" y="6" width="438" height="158" fill="url(#pgBloomC)"/>
    <rect x="461" y="6" width="438" height="158" fill="url(#pgFill)"/>
    <rect x="461" y="6" width="438" height="158" fill="url(#pgScanC)"/>
  </g>
  <rect x="461.5" y="6.5" width="437" height="157" rx="18" fill="none" stroke="url(#pgRim)" stroke-width="1"/>

  <text x="482" y="29" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace"
        font-size="9" fill="#00f0ff" fill-opacity="0.55" letter-spacing="1.6">[REPO.0x02]</text>

  <text x="482" y="63" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace"
        font-size="19" font-weight="700" fill="#00f0ff" filter="url(#pgGlowC)" letter-spacing="-0.4">
    <tspan fill-opacity="0.5">$ </tspan>byd-apps
  </text>

  <text x="482" y="91" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace"
        font-size="11.5" fill="#8fb8a0" letter-spacing="0">
    <tspan x="482" dy="0">custom android apps for byd vehicles —</tspan>
    <tspan x="482" dy="16">door sounds, can bus tools. no root needed.</tspan>
  </text>

  <g transform="translate(482 139)">
    <circle cx="4" cy="-3" r="4" fill="#00f0ff">
      <animate attributeName="fill-opacity" values="0.7;1;0.7" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="14" y="0" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace"
          font-size="10" fill="#00f0ff" letter-spacing="0.4">Kotlin · Android</text>
  </g>
  <text x="878" y="139" text-anchor="end"
        font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace"
        font-size="10" fill="#4a6b58" letter-spacing="0.6">→ open repo</text>
</svg>

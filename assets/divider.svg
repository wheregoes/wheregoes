<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 30">
  <rect width="100%" height="100%" fill="transparent"/>

  <!-- Center line with glow -->
  <line x1="100" y1="15" x2="800" y2="15" stroke="#00ff00" stroke-width="0.5" opacity="0.4"/>

  <!-- Animated pulse traveling along the line -->
  <circle r="3" fill="#00ff00" opacity="0.8">
    <animate attributeName="cx" from="100" to="800" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="15" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0.8;0" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle r="6" fill="none" stroke="#00ff00" stroke-width="0.5" opacity="0.3">
    <animate attributeName="cx" from="100" to="800" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="15" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.3;0.3;0" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Terminal markers -->
  <text x="60" y="19" fill="#00ff00" font-size="10" font-family="monospace" opacity="0.3">[</text>
  <text x="810" y="19" fill="#00ff00" font-size="10" font-family="monospace" opacity="0.3">]</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 40" role="presentation">
  <defs>
    <linearGradient id="shLineH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="shGlowH" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="8" width="48" height="24" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
  <text x="24" y="24" text-anchor="middle"
        font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace"
        font-size="11" fill="#8fb8a0" letter-spacing="1.6" font-weight="500">0x04</text>

  <text x="62" y="27"
        font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace"
        font-size="20" fill="#e8ffef" font-weight="600" letter-spacing="-0.2">
    <tspan fill="#00ff88" filter="url(#shGlowH)">$ </tspan>history
  </text>

  <line x1="210" y1="20" x2="838" y2="20" stroke="url(#shLineH)" stroke-width="1"/>
  <circle cx="524" cy="20" r="1.3" fill="#ffb800" fill-opacity="0.7">
    <animate attributeName="fill-opacity" values="0.3;0.9;0.3" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <text x="900" y="25" text-anchor="end"
        font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace"
        font-size="10" fill="#00ff88" font-weight="600" letter-spacing="2" filter="url(#shGlowH)">[OK]</text>
</svg>
